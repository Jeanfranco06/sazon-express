server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          # Por defecto consulta el repositorio remoto oficial en GitHub.
          # Puede ser sobrescrito localmente con variable de entorno o propiedad:
          # -Dspring.cloud.config.server.git.uri=file:///...
          uri: ${CONFIG_REPO_URI:https://github.com/Jeanfranco06/sazon-express-config}
          default-label: main
          clone-on-start: true
          force-pull: true

# Configuración de Actuator para monitoreo del Config Server
management:
  endpoints:
    web:
      exposure:
        include: "health,info,env"
  endpoint:
    health:
      show-details: always
